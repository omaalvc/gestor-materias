<div class="container mt-4">
  <div class="header">
    <h2>Listado de Materias</h2>
    <button *ngIf="role !== 'Estudiante'" class="btn btn-primary" (click)="nuevaMateria()">
      <i class="fas fa-plus me-2"></i>Nueva Materia
    </button>
  </div>

  <div *ngIf="loading" class="loading-spinner">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="error" class="alert alert-danger mt-3">
    {{ error }}
  </div>

  <div class="table-responsive" *ngIf="!loading && materias.length > 0">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Créditos</th>
          <th>Profesor</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let materia of materias">
          <td>{{ materia.id }}</td>
          <td>{{ materia.nombre }}</td>
          <td>{{ materia.descripcion }}</td>
          <td>{{ materia.creditos }}</td>
          <td>{{ materia.profesor?.nombre || 'Sin profesor asignado' }}</td>
          <td>
            <div class="btn-group">
              <button type="button" class="btn btn-info me-2" (click)="verDetalle(materia.id)">
                <i class="fas fa-eye me-1"></i> Ver
              </button>
              <button *ngIf="role !== 'Estudiante'" type="button" class="btn btn-success me-2" (click)="inscribirMateria(materia.id)">
                <i class="fas fa-user-plus me-1"></i> Inscribir
              </button>
              <button *ngIf="role !== 'Estudiante'" type="button" class="btn btn-warning me-2" (click)="editarMateria(materia.id)">
                <i class="fas fa-edit me-1"></i> Editar
              </button>
              <button *ngIf="role !== 'Estudiante'" type="button" class="btn btn-danger" (click)="eliminarMateria(materia.id)">
                <i class="fas fa-trash me-1"></i> Eliminar
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && materias.length === 0" class="text-center mt-4">
    <p class="lead">No hay materias registradas</p>
  </div>
</div>
