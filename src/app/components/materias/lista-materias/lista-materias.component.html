<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Listado de Materias</h2>
    <button class="btn btn-primary" (click)="nuevaMateria()">
      <i class="fas fa-plus me-2"></i>Nueva Materia
    </button>
  </div>
  
  <div *ngIf="error" class="alert alert-danger" role="alert">
    {{ error }}
  </div>

  <div *ngIf="loading" class="text-center my-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <p class="mt-2">Cargando materias...</p>
  </div>

  <div *ngIf="!loading && materias.length === 0" class="alert alert-info">
    No hay materias registradas.
  </div>

  <div class="table-responsive" *ngIf="!loading && materias.length > 0">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Créditos</th>
          <th>Profesor</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let materia of materias">
          <td>{{ materia.id }}</td>
          <td>{{ materia.nombre }}</td>
          <td>{{ materia.descripcion }}</td>
          <td>{{ materia.creditos }}</td>
          <td>{{ materia.profesor?.nombre || 'Sin profesor asignado' }}</td>
          <td>
            <div class="btn-group">
              <button class="btn btn-info me-2" [routerLink]="['/materias/view', materia.id]">
                <i class="fas fa-eye me-1"></i> Ver
              </button>
              <button class="btn btn-warning me-2" (click)="editarMateria(materia.id)">
                <i class="fas fa-edit me-1"></i> Editar
              </button>
              <button class="btn btn-danger" (click)="eliminarMateria(materia.id)">
                <i class="fas fa-trash me-1"></i> Eliminar
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
