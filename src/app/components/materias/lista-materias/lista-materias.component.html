<div class="container">
  <div class="header">
    <h2>Listado de Materias</h2>
    <button *ngIf="isAdmin" class="btn btn-primary" (click)="nuevaMateria()">
      <i class="fas fa-plus"></i> Nueva Materia
    </button>
  </div>
  
  <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
  
  <div class="loading-spinner" *ngIf="loading">
    <div class="spinner-border" role="status">
      <span class="sr-only">Cargando...</span>
    </div>
  </div>
  
  <div class="table-responsive" *ngIf="!loading">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Créditos</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="materias.length === 0">
          <td colspan="5" class="text-center">No hay materias registradas</td>
        </tr>
        <tr *ngFor="let materia of materias">
          <td>{{ materia.id }}</td>
          <td>{{ materia.nombre }}</td>
          <td>{{ materia.descripcion }}</td>
          <td>{{ materia.creditos }}</td>
          <td>
            <button class="btn btn-sm btn-info" (click)="verDetalle(materia.id!)">
              <i class="fas fa-eye"></i> Ver
            </button>
            <button *ngIf="isAdmin" class="btn btn-sm btn-warning" (click)="editarMateria(materia.id!)">
              <i class="fas fa-edit"></i> Editar
            </button>
            <button *ngIf="isAdmin" class="btn btn-sm btn-danger" (click)="eliminarMateria(materia.id!)">
              <i class="fas fa-trash"></i> Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
