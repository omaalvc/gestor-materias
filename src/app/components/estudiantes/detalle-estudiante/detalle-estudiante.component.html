<div class="container mt-4">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2>Estudiante {{ estudiante?.nombre || 'Detalle del Estudiante' }}</h2>
      <button class="btn btn-secondary" (click)="volver()">
        <i class="fas fa-arrow-left me-2"></i>Volver
      </button>
    </div>

    <div *ngIf="loading" class="card-body text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>

    <div *ngIf="errorMsg" class="alert alert-danger m-3">
      {{ errorMsg }}
    </div>

    <div class="card-body" *ngIf="estudiante && !loading">
      <div class="mb-4">
        <!-- <h3>{{ estudiante.nombre }}</h3> -->
        <!-- <p class="text-muted">{{ estudiante.email }}</p> -->
      </div>

      <div class="mb-4">
        <h4>Materias Matriculadas</h4>
        <div class="list-group">
          <div class="list-group-item" *ngFor="let materia of estudiante.materias">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h5 class="mb-1">{{ materia.nombre }}</h5>
                <p class="mb-1">{{ materia.descripcion }}</p>
                <small>Créditos: {{ materia.creditos }}</small>
              </div>
            </div>
          </div>
        </div>
        <div *ngIf="!estudiante.materias?.length" class="alert alert-info mt-3">
          No hay materias matriculadas
        </div>
      </div>
    </div>
  </div>
</div>
