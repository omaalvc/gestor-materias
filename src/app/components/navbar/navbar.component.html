<nav *ngIf="isLoggedIn()" class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" routerLink="/">
      <i class="fas fa-book-open me-2"></i>Gestor de Materias
    </a>
    
    <button class="navbar-toggler" type="button" (click)="isMenuCollapsed = !isMenuCollapsed">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <!-- Sección de administrador -->
        <ng-container *ngIf="isAdmin()">
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/materias" routerLinkActive="active">Materias</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/profesores" routerLinkActive="active">Profesores</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/estudiantes" routerLinkActive="active">Estudiantes</a>
          </li>
        </ng-container>
        
        <!-- Sección para usuarios no administradores -->
        <ng-container *ngIf="!isAdmin()">
          <li class="nav-item">
            <a class="nav-link" routerLink="/materias" routerLinkActive="active">Mis Materias</a>
          </li>
        </ng-container>
      </ul>

      <div class="navbar-nav ms-auto">
        <div class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" id="userDropdown" role="button" 
             data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-user me-2"></i>{{ currentUser?.fullName || currentUser?.username }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" routerLink="/perfil">
              <i class="fas fa-user-cog me-2"></i>Mi Perfil
            </a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" (click)="logout()" style="cursor: pointer;">
              <i class="fas fa-sign-out-alt me-2"></i>Cerrar sesión
            </a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
